# yaml-language-server: $schema=https://json.schemastore.org/pre-commit-config.json
---
ci:
  autoupdate_schedule: quarterly
  skip: ["identity", "check-dbt-project-version"]

default_install_hook_types: ["pre-commit", "pre-push"]
default_stages: ["pre-commit"]

repos:
  - repo: meta
    hooks:
      - id: identity

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: ["--branch", "main"]
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix", "lf"]
      - id: check-added-large-files
        exclude: "^seeds/calendar.csv$"
      - id: check-json
      - id: check-yaml
      - id: check-toml
      - id: check-ast
      - id: detect-private-key

  - repo: https://github.com/pre-commit/pre-commit
    rev: v4.7.0
    hooks:
      - id: validate_manifest

  - repo: https://github.com/pre-commit-ci/pre-commit-ci-config
    rev: v1.6.1
    hooks:
      - id: check-pre-commit-ci-config

  - repo: https://github.com/billwallis/bills-hooks
    rev: v0.0.17
    hooks:
      - id: banned-python-code
      - id: check-github-codeowners
      - id: check-no-commit-comment
      - id: tidy-gitkeep
  - repo: local
    hooks:
      - id: check-dbt-project-version
        name: Check dbt project version
        entry: >
          check-dbt-project-version
          --dbt-project-dir '.'
          --python-project-name 'dbt-calendar'
        language: unsupported
        always_run: true
        pass_filenames: false

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.2
    hooks:
      - id: check-github-workflows
      - id: check-compose-spec

  - repo: local
    hooks:
      - id: check-pyproject
        name: Validate pyproject.toml schema
        entry: check-jsonschema
        args: ["--schemafile", "https://json.schemastore.org/pyproject.json"]
        files: pyproject.toml
        pass_filenames: true
        language: python
        additional_dependencies: ["check-jsonschema==0.38.2"]
        # This calls a remote URL, so run on pre-push to avoid slowing down commits
        stages: ["pre-push"]
