# yaml-language-server: $schema=https://json.schemastore.org/pyproject.json
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "dbt-calendar"
version = "0.0.1"
description = "A calendar data model for dbt projects."
authors = [{name = "billwallis"}]
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "duckdb>=1.5.0",
]

[dependency-groups]
dev = [
    "poethepoet>=0.48.0",
    "pre-commit>=4.7.0",
]
test = [
    "bills-hooks @ git+https://github.com/billwallis/bills-hooks@v0.0.17",
    "dbt-core<2.0.0",
    "dbt-duckdb>=1.10.1",
]


[tool.poe]
verbosity = -1
envfile.optional = ".env"

[tool.poe.tasks]
install.shell = """
    pip install --editable . --group dev --group test
    pre-commit install --install-hooks
    dbt deps
"""
run = "python -m src.dbt_calendar"
test = "python ./run_test.py"
clean.shell = """
    rm -rf integration_tests/dbt_packages/
    rm -rf integration_tests/logs/
    rm -rf integration_tests/target/
    rm -rf integration_tests/tests.duckdb
    rm -rf logs/
"""

[tool.poe.tasks.lint]
control.expr = "sys.platform"

[[tool.poe.tasks.lint.switch]]
case = "win32"
shell = """
    echo '=== pre-commit checks ==='
    SKIP=identity pre-commit run --all-files --hook-stage pre-commit
    echo '=== pre-push checks ==='
    SKIP=identity pre-commit run --all-files --hook-stage pre-push
"""

[[tool.poe.tasks.lint.switch]]
shell = """
    echo '\\033[0;34mpre-commit checks\\033[0m'
    SKIP=identity pre-commit run --all-files --hook-stage pre-commit
    echo '\\033[0;34mpre-push checks\\033[0m'
    SKIP=identity pre-commit run --all-files --hook-stage pre-push
"""
